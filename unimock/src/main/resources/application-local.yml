ops:
  ai:
    unimock:
      database:
        url: ${OPS_AI_UNIMOCK_DB_URL:jdbc:postgresql://localhost:5432/hotelopai}
        username: ${OPS_AI_UNIMOCK_DB_USERNAME:hotelopai}
        password: ${OPS_AI_UNIMOCK_DB_PASSWORD:hotelopai}
