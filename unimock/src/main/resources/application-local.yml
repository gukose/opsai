        maximum-pool-size: ${OPS_AI_UNIMOCK_DB_MAXIMUM_POOL_SIZE:5}
      demo-console:
        hotel-opai-base-url: ${OPS_AI_HOTEL_OPAI_BASE_URL:http://localhost:8080}
