spring:
  application:
    name: unimock
  profiles:
    default: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    default-schema: unimock
    schemas:
      - unimock
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ops:
  ai:
    unimock:
      seed:
        path: ${OPS_AI_UNIMOCK_SEED_PATH:classpath:/simulation/grand-hotel}

server:
  # Railway private networking is IPv6. The IPv6 wildcard also accepts the
  # platform health check and keeps local IPv4 access on dual-stack hosts.
  address: "${SERVER_ADDRESS:::}"
  port: ${PORT:${SERVER_PORT:8090}}
