spring:
  application:
    name: hotel-opai
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    default-schema: public
    schemas:
      - public

ops:
  ai:
    voice:
      active-provider: internal-demo
      maximum-audio-bytes: 10000000
      external:
        enabled: false
        endpoint: https://api.openai.com/v1/audio/transcriptions
        model: gpt-4o-mini-transcribe
        credential-reference: env:OPENAI_API_KEY
        allowed-profiles:
          - demo
        timeout: PT45S
    auth:
      jwt:
        issuer: hotel-opai
        access-token-ttl: PT15M
        refresh-token-ttl: P30D
      seed:
        enabled: false
    scheduler:
      enabled: true
      instance-id: backend
      default-lock-timeout: PT10M
      shutdown-timeout: PT30S
      lease-renewal-enabled: true
      lease-renewal-interval: PT1M
      lease-renewal-safety-margin: PT30S
    pms:
      active-provider: internal-demo
      providers:
        internal-demo:
          enabled: true
          display-name: Internal Demo PMS
          authentication:
            mode: NONE
          request-timeout: PT5S
        apaleo:
          enabled: false
          display-name: Apaleo Sandbox PMS
          endpoint: https://api.apaleo.com
          production-approved: false
          allowed-profiles:
            - apaleo-sandbox
            - local
            - test
          authentication:
            mode: OAUTH2_CLIENT_CREDENTIALS
            oauth2-client-credentials:
              token-url: https://identity.apaleo.com/connect/token
              client-id-reference: env:APALEO_CLIENT_ID
              client-secret-reference: env:APALEO_CLIENT_SECRET
              scopes:
                - properties.read
                - units.read
                - reservations.read
          request-timeout: PT5S
          settings:
            max-pages: "2"
            page-size: "100"
            health-check-timeout: PT2S
            retry-max-attempts: "2"
            retry-initial-backoff: PT0.1S
            retry-max-backoff: PT1S
            max-rate-limit-delay: PT2S
            circuit-failure-threshold: "3"
            circuit-open-duration: PT30S
            circuit-half-open-max-attempts: "1"
            token-expiry-safety-window: PT60S
            webhook-token-reference: env:APALEO_WEBHOOK_TOKEN
    task:
      overdue:
        enabled: true
        lock-timeout: PT10M
      overdue-check-interval-ms: 300000
    reservation:
      task-automation:
        enabled: false
        batch-size: 10
        max-attempts: 3
        retry-delay: PT5M
        enabled-rule-ids: []
        default-due-time: "12:00"
        same-day-due-time: "16:00"
        follow-up-delay: PT2H
        timezone: UTC
        minimum-lead-time: PT1H
        allowed-profiles: []
        processor-id: reservation-task-automation
        schedule:
          enabled: false
          execution-interval: PT1M
          startup-delay: PT2M
          batch-size: 10
          max-records-per-execution: 10
          lock-timeout: PT5M
          abandoned-lease-threshold: PT10M
          allowed-profiles: []
      task-recommendations:
        enabled: false
        batch-size: 10
        max-recommendations-per-reservation: 5
        max-reservations-per-batch: 10
        max-attempts: 3
        retry-delay: PT5M
        request-timeout: PT5S
        due-time: "17:00"
        timezone: UTC
        expiration: P7D
        maximum-reservation-age: P30D
        maximum-review-age: P7D
        provider-name: internal-demo
        active-provider: internal-demo
        prompt-version: reservation-task-recommendation-demo-v1
        allowed-profiles: []
        external-providers:
          allowed-profiles:
            - local
            - test
          production-prohibited: true
          require-https-outside-local: true
          local-endpoint-allowlist:
            - http://localhost
            - http://127.0.0.1
          diagnostics-retention: P30D
          diagnostics-cleanup-batch-size: 100
        providers:
          internal-demo:
            enabled: true
            display-name: Internal Demo Recommendations
            deterministic: true
          openai:
            enabled: false
            display-name: OpenAI Recommendations
            endpoint: https://api.openai.com/v1/chat/completions
            timeout: PT10S
            maximum-tokens: 512
            temperature: 0.0
            top-p: 1.0
            allowed-profiles: []
            activation-mode: SMOKE_TEST_ONLY
            allow-fallback-to-internal-demo: false
            prompt-template-id: reservation-task-recommendation-v1
            prompt-version: reservation-task-recommendation-openai-v1
            smoke:
              enabled: false
              fixture-mode-enabled: false
            retry-policy:
              max-attempts: 2
              initial-backoff: PT0.25S
              max-backoff: PT2S
        pilot:
          enabled: false
          allowed-profiles:
            - local
            - test
          allowed-provider-ids:
            - openai
          allowed-property-scopes: []
          max-reservations-per-run: 5
          max-recommendations-per-run: 10
          daily-request-budget: 25
          daily-token-budget:
          required-successful-smoke-age: PT24H
          mandatory-operator-approval-mode: true
          maximum-candidate-age: P30D
        pilot-schedule:
          enabled: false
          execution-interval: PT6H
          startup-delay: PT2M
          batch-size: 5
          max-runs-per-day: 2
          allowed-profiles:
            - local
            - test
          lock-timeout: PT10M
          minimum-interval-between-runs: PT1H
          retention-cleanup-enabled: false
          cleanup-execution-interval: PT24H
          cleanup-batch-size: 100
        pilot-review:
          max-bulk-review-items: 50
          max-decision-note-length: 500
          max-export-rows: 1000
          max-export-date-range: P31D
        schedule:
          enabled: false
          execution-interval: PT5M
          startup-delay: PT2M
          batch-size: 10
          max-reservations-per-execution: 10
          lock-timeout: PT5M
          abandoned-lease-threshold: PT10M
          allowed-profiles: []
          retention-cleanup-enabled: false
          cleanup-execution-interval: PT12H
          cleanup-batch-size: 100
        retention:
          completed-run-retention: P30D
          rejected-recommendation-retention: P30D
          failed-run-retention: P14D
          applied-recommendation-retention: P180D
      webhooks:
        enabled: false
        processing-enabled: false
        max-request-bytes: 65536
        timestamp-tolerance: PT10M
        batch-size: 10
        max-attempts: 3
        initial-backoff: PT1M
        max-backoff: PT15M
        abandoned-processing-timeout: PT15M
        completed-retention: P30D
        rejected-retention: P7D
        cleanup-batch-size: 100
        schedule:
          enabled: false
          execution-interval: PT1M
          startup-delay: PT2M
          batch-size: 10
          max-records-per-execution: 10
          lock-timeout: PT5M
          allowed-profiles: []
          retention-cleanup-enabled: false
          cleanup-max-records: 100
          dead-letter-retention: P90D
          cleanup-lock-timeout: PT5M
      sync:
        operations:
          enabled-automatic-triggers: false
          max-window: P31D
          history-retention: P180D
          lock-ttl: PT15M
          max-page-size: 100
        schedule:
          enabled: false
          property-scope: configured
          window-strategy: LOOKBACK_LOOKAHEAD
          lookback-days: 1
          lookahead-days: 14
          timezone: UTC
          execution-interval: PT30M
          startup-delay: PT2M
          max-runs-per-execution: 1
          stale-run-recovery-threshold: PT30M
          lock-timeout: PT10M
          allowed-profiles: []
          retention-cleanup-enabled: false
          retention-cleanup-max-runs: 100
    knowledge:
      chunk-size: 1200
      chunk-overlap: 120
      max-import-characters: 1000000
      retrieval-quality:
        gates-enabled: false
        verification-enabled: false
        dataset-version: hotel-operations-curated-v1
        k: 5
        modes: [KEYWORD, SEMANTIC, HYBRID]
        default-thresholds:
          minimum-precision-at-k: 0.1
          minimum-recall-at-k: 0.1
          minimum-mrr: 0.1
          minimum-ndcg: 0.1
          minimum-hit-rate: 0.5
          maximum-average-latency-millis: 5000
          minimum-evaluated-query-count: 1
        keyword-thresholds:
          minimum-hit-rate: 0.7
        semantic-thresholds:
          minimum-hit-rate: 0.5
        hybrid-thresholds:
          minimum-hit-rate: 0.7
      rag-context:
        maximum-retrieved-chunks: 8
        maximum-chunks-per-document: 3
        maximum-characters-per-chunk: 800
        maximum-total-context-characters: 4000
        minimum-retrieval-score: 0.0
        allowed-categories: []
        language-policy: [en]
      answers:
        enabled: false
        active-provider: internal-demo
        model: internal-demo-knowledge-answer-v1
        prompt-template-id: knowledge-answer-v1
        prompt-version: knowledge-answer-prompt-v1
        context-schema-version: knowledge-context-v1
        max-prompt-characters: 8000
        max-query-characters: 200
        max-answer-characters: 1200
        minimum-context-items: 1
        duplicate-window: PT15M
        history-retention: P30D
        history-cleanup-batch-size: 100
        hourly-request-limit: 60
        daily-request-limit: 250
        maximum-concurrent-requests: 2
        in-flight-abandoned-timeout: PT10M
        max-retry-attempts: 2
        providers:
          internal-demo:
            enabled: true
          openai:
            enabled: false
            endpoint: https://api.openai.com/v1/chat/completions
            model: gpt-5-mini
            credential-reference:
            timeout: PT10S
            max-attempts: 2
            maximum-tokens: 512
            temperature: 0.0
            top-p: 1.0
            allowed-profiles: []
            smoke-test-only: true
            smoke-test-enabled: false
            fixture-mode-enabled: false
            allow-fallback-to-internal-demo: false
          external-policy:
            production-prohibited: true
            allowed-profiles: [local, test]
            require-https-outside-local: true
            local-endpoint-allowlist: [http://localhost, http://127.0.0.1]
            diagnostics-retention: P30D
            diagnostics-cleanup-batch-size: 100
      semantic-search:
        enabled: false
        active-provider: deterministic-local
        model: deterministic-local-v1
        vector-dimension: 16
        batch-size: 20
        request-timeout: PT5S
        max-attempts: 3
        allowed-profiles: []
        credential-reference:
        similarity-threshold: 0.15
        semantic-result-limit: 20
        hybrid-keyword-weight: 0.55
        hybrid-semantic-weight: 0.45
        keyword-fallback-enabled: false
        diagnostics-retention: P30D
        diagnostics-cleanup-batch-size: 100
        external-providers:
          production-prohibited: true
          allowed-profiles: [local, test]
          require-https-outside-local: true
          local-endpoint-allowlist: [http://localhost, http://127.0.0.1]
          openai:
            enabled: false
            endpoint: https://api.openai.com/v1/embeddings
            model: text-embedding-3-small
            dimensions: 1536
            timeout: PT10S
            max-attempts: 2
            allowed-profiles: []
            credential-reference:
            smoke-test-enabled: false
        schedule:
          enabled: false
          execution-interval: PT10M
          startup-delay: PT2M
          batch-size: 20
          lock-timeout: PT5M
          allowed-profiles: [local, test]
          cleanup-enabled: false
          cleanup-execution-interval: PT24H
    outbox:
      enabled: true
      poll-interval: ${OPS_AI_OUTBOX_POLL_INTERVAL:PT10S}
      batch-size: 25
      max-attempts: 5
      initial-retry-delay: PT10S
      retry-multiplier: 2.0
      max-retry-delay: PT5M
      lock-timeout: PT5M
      completed-retention: P14D
      failed-retention: P30D
      cleanup-batch-size: 100
      cleanup-execution-interval: ${OPS_AI_OUTBOX_CLEANUP_INTERVAL:PT1M}
      processor-id: backend

assistant:
  ai:
    provider: ${ASSISTANT_AI_PROVIDER:deterministic}
    fallback-enabled: ${ASSISTANT_AI_FALLBACK_ENABLED:true}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:}
      request-timeout: ${OPENAI_REQUEST_TIMEOUT:PT20S}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:400}
      temperature: ${OPENAI_TEMPERATURE:0.0}
      retries: ${OPENAI_RETRIES:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: v1
        url: /v3/api-docs/v1
      - name: dev-pms
        url: /v3/api-docs/dev-pms
    urls-primary-name: v1
