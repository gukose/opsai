spring:
  application:
    name: hotel-opai
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    default-schema: public
    schemas:
      - public

ops:
  ai:
    auth:
      jwt:
        issuer: hotel-opai
        access-token-ttl: PT15M
        refresh-token-ttl: P30D
      seed:
        enabled: false
    scheduler:
      enabled: true
      instance-id: backend
      default-lock-timeout: PT10M
      shutdown-timeout: PT30S
      lease-renewal-enabled: true
      lease-renewal-interval: PT1M
      lease-renewal-safety-margin: PT30S
    pms:
      active-provider: internal-demo
      providers:
        internal-demo:
          enabled: true
          display-name: Internal Demo PMS
          authentication:
            mode: NONE
          request-timeout: PT5S
        apaleo:
          enabled: false
          display-name: Apaleo Sandbox PMS
          endpoint: https://api.apaleo.com
          production-approved: false
          allowed-profiles:
            - apaleo-sandbox
            - local
            - test
          authentication:
            mode: OAUTH2_CLIENT_CREDENTIALS
            oauth2-client-credentials:
              token-url: https://identity.apaleo.com/connect/token
              client-id-reference: env:APALEO_CLIENT_ID
              client-secret-reference: env:APALEO_CLIENT_SECRET
              scopes:
                - properties.read
                - units.read
                - reservations.read
          request-timeout: PT5S
          settings:
            max-pages: "2"
            page-size: "100"
            health-check-timeout: PT2S
            retry-max-attempts: "2"
            retry-initial-backoff: PT0.1S
            retry-max-backoff: PT1S
            max-rate-limit-delay: PT2S
            circuit-failure-threshold: "3"
            circuit-open-duration: PT30S
            circuit-half-open-max-attempts: "1"
            token-expiry-safety-window: PT60S
            webhook-token-reference: env:APALEO_WEBHOOK_TOKEN
    task:
      overdue:
        enabled: true
        lock-timeout: PT10M
      overdue-check-interval-ms: 300000
    reservation:
      task-automation:
        enabled: false
        batch-size: 10
        max-attempts: 3
        retry-delay: PT5M
        enabled-rule-ids: []
        default-due-time: "12:00"
        same-day-due-time: "16:00"
        follow-up-delay: PT2H
        timezone: UTC
        minimum-lead-time: PT1H
        allowed-profiles: []
        processor-id: reservation-task-automation
        schedule:
          enabled: false
          execution-interval: PT1M
          startup-delay: PT2M
          batch-size: 10
          max-records-per-execution: 10
          lock-timeout: PT5M
          abandoned-lease-threshold: PT10M
          allowed-profiles: []
      task-recommendations:
        enabled: false
        batch-size: 10
        max-recommendations-per-reservation: 5
        max-reservations-per-batch: 10
        max-attempts: 3
        retry-delay: PT5M
        request-timeout: PT5S
        due-time: "17:00"
        timezone: UTC
        expiration: P7D
        maximum-reservation-age: P30D
        maximum-review-age: P7D
        provider-name: internal-demo
        active-provider: internal-demo
        prompt-version: reservation-task-recommendation-demo-v1
        allowed-profiles: []
        external-providers:
          allowed-profiles:
            - local
            - test
          production-prohibited: true
          require-https-outside-local: true
          local-endpoint-allowlist:
            - http://localhost
            - http://127.0.0.1
          diagnostics-retention: P30D
          diagnostics-cleanup-batch-size: 100
        providers:
          internal-demo:
            enabled: true
            display-name: Internal Demo Recommendations
            deterministic: true
          openai:
            enabled: false
            display-name: OpenAI Recommendations
            endpoint: https://api.openai.com/v1/chat/completions
            timeout: PT10S
            maximum-tokens: 512
            temperature: 0.0
            top-p: 1.0
            allowed-profiles: []
            activation-mode: SMOKE_TEST_ONLY
            allow-fallback-to-internal-demo: false
            prompt-template-id: reservation-task-recommendation-v1
            prompt-version: reservation-task-recommendation-openai-v1
            smoke:
              enabled: false
              fixture-mode-enabled: false
            retry-policy:
              max-attempts: 2
              initial-backoff: PT0.25S
              max-backoff: PT2S
        pilot:
          enabled: false
          allowed-profiles:
            - local
            - test
          allowed-provider-ids:
            - openai
          allowed-property-scopes: []
          max-reservations-per-run: 5
          max-recommendations-per-run: 10
          daily-request-budget: 25
          daily-token-budget:
          required-successful-smoke-age: PT24H
          mandatory-operator-approval-mode: true
          maximum-candidate-age: P30D
        pilot-schedule:
          enabled: false
          execution-interval: PT6H
          startup-delay: PT2M
          batch-size: 5
          max-runs-per-day: 2
          allowed-profiles:
            - local
            - test
          lock-timeout: PT10M
          minimum-interval-between-runs: PT1H
          retention-cleanup-enabled: false
          cleanup-execution-interval: PT24H
          cleanup-batch-size: 100
        schedule:
          enabled: false
          execution-interval: PT5M
          startup-delay: PT2M
          batch-size: 10
          max-reservations-per-execution: 10
          lock-timeout: PT5M
          abandoned-lease-threshold: PT10M
          allowed-profiles: []
          retention-cleanup-enabled: false
          cleanup-execution-interval: PT12H
          cleanup-batch-size: 100
        retention:
          completed-run-retention: P30D
          rejected-recommendation-retention: P30D
          failed-run-retention: P14D
          applied-recommendation-retention: P180D
      webhooks:
        enabled: false
        processing-enabled: false
        max-request-bytes: 65536
        timestamp-tolerance: PT10M
        batch-size: 10
        max-attempts: 3
        initial-backoff: PT1M
        max-backoff: PT15M
        abandoned-processing-timeout: PT15M
        completed-retention: P30D
        rejected-retention: P7D
        cleanup-batch-size: 100
        schedule:
          enabled: false
          execution-interval: PT1M
          startup-delay: PT2M
          batch-size: 10
          max-records-per-execution: 10
          lock-timeout: PT5M
          allowed-profiles: []
          retention-cleanup-enabled: false
          cleanup-max-records: 100
          dead-letter-retention: P90D
          cleanup-lock-timeout: PT5M
      sync:
        operations:
          enabled-automatic-triggers: false
          max-window: P31D
          history-retention: P180D
          lock-ttl: PT15M
          max-page-size: 100
        schedule:
          enabled: false
          property-scope: configured
          window-strategy: LOOKBACK_LOOKAHEAD
          lookback-days: 1
          lookahead-days: 14
          timezone: UTC
          execution-interval: PT30M
          startup-delay: PT2M
          max-runs-per-execution: 1
          stale-run-recovery-threshold: PT30M
          lock-timeout: PT10M
          allowed-profiles: []
          retention-cleanup-enabled: false
          retention-cleanup-max-runs: 100
    outbox:
      enabled: true
      poll-interval: PT5S
      batch-size: 25
      max-attempts: 5
      initial-retry-delay: PT10S
      retry-multiplier: 2.0
      max-retry-delay: PT5M
      lock-timeout: PT5M
      completed-retention: P14D
      failed-retention: P30D
      cleanup-batch-size: 100
      processor-id: backend

assistant:
  ai:
    provider: ${ASSISTANT_AI_PROVIDER:deterministic}
    fallback-enabled: ${ASSISTANT_AI_FALLBACK_ENABLED:true}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:}
      request-timeout: ${OPENAI_REQUEST_TIMEOUT:PT20S}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:400}
      temperature: ${OPENAI_TEMPERATURE:0.0}
      retries: ${OPENAI_RETRIES:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    urls:
      - name: v1
        url: /v3/api-docs/v1
      - name: dev-pms
        url: /v3/api-docs/dev-pms
    urls-primary-name: v1
